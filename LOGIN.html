<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Iniciar Sesión | Ferretería BOB</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}
body{
    font-family:Arial,Helvetica,sans-serif;
    background:linear-gradient(rgba(31,41,55,.85),rgba(31,41,55,.85)),url("martillo.jpg");
    background-size:cover;
    background-position:center;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}
.contenedor{
    width:100%;
    max-width:420px;
    background:white;
    padding:35px;
    border-radius:12px;
    box-shadow:0 10px 30px rgba(0,0,0,.3);
}
h1{
    text-align:center;
    color:#1f2937;
    margin-bottom:8px;
}
h1 span{
    color:#f59e0b;
}
.subtitulo{
    text-align:center;
    color:#666;
    margin-bottom:25px;
}
.grupo{
    margin-bottom:18px;
}
label{
    display:block;
    font-weight:bold;
    color:#1f2937;
    margin-bottom:7px;
}
input{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:15px;
}
input:focus{
    outline:none;
    border-color:#f59e0b;
}
button{
    width:100%;
    padding:13px;
    background:#f59e0b;
    color:white;
    border:none;
    border-radius:6px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}
button:hover{
    background:#d97706;
}
.enlace{
    text-align:center;
    margin-top:20px;
    color:#666;
}
.enlace a{
    color:#d97706;
    font-weight:bold;
    text-decoration:none;
}
.enlace a:hover{
    text-decoration:underline;
}
.volver{
    text-align:center;
    margin-top:15px;
}
.volver a{
    color:#1f2937;
    text-decoration:none;
    font-weight:bold;
}
.volver a:hover{
    color:#f59e0b;
}
</style>
</head>
<body>
<div class="contenedor">
    <h1>Ferretería <span>BOB</span></h1>
    <p class="subtitulo">
        Inicia sesión en tu cuenta
    </p>
    <form id="formLogin">
        <div class="grupo">
            <label for="correo">Correo electrónico</label>
            <input type="email" id="correo" placeholder="ejemplo@gmail.com" required>
        </div>
        <div class="grupo">
            <label for="password">Contraseña</label>
            <input type="password" id="password" placeholder="Ingresa tu contraseña" required>
        </div>
        <button type="submit">Iniciar sesión</button>
    </form>
    <div class="enlace">
        ¿No tienes una cuenta?
        <a href="REGISTRO.html">Registrarse</a>
    </div>
    <div class="volver">
        <a href="INICIO.html">← Volver al inicio</a>
    </div>
</div>
<script>
document.getElementById("formLogin").addEventListener("submit",async function(e){
    e.preventDefault();

    const correo=document.getElementById("correo").value.trim();
    const password=document.getElementById("password").value;

    try{
        const respuesta=await fetch("https://ferreteria-bob.onrender.com/api/usuarios/login",{
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                correo,
                password
            })
        });
        const datos = await respuesta.json();

if (!respuesta.ok) {
    alert(datos.mensaje);
    return;
}
localStorage.setItem("usuario", correo);
alert("Bienvenido " + datos.nombre);
if (datos.rol === "administrador") {
    window.location.href = "ADMIN.html";
} else {
    window.location.href = "PRODUCTOS.html";
}
}
catch (error) {
    console.error("Error al iniciar sesión:", error);
    alert("Ocurrió un error al iniciar sesión. Por favor, inténtalo de nuevo.");
}
});
</script>
</body>
</html>
