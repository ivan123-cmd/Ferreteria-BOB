<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro | Ferretería BOB</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:linear-gradient(rgba(31,41,55,.85), rgba(31,41,55,.85)), url("martillo.jpg");
    background-size:cover;
    background-position:center;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.contenedor{
    width:100%;
    max-width:450px;
    background:white;
    padding:35px;
    border-radius:12px;
    box-shadow:0 10px 30px rgba(0,0,0,.3);
}

h1{
    text-align:center;
    color:#1f2937;
    margin-bottom:8px;
}

h1 span{
    color:#f59e0b;
}

.subtitulo{
    text-align:center;
    color:#666;
    margin-bottom:25px;
}

.grupo{
    margin-bottom:16px;
}

label{
    display:block;
    font-weight:bold;
    color:#1f2937;
    margin-bottom:7px;
}

input{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:15px;
}

input:focus{
    outline:none;
    border-color:#f59e0b;
}

button{
    width:100%;
    padding:13px;
    background:#f59e0b;
    color:white;
    border:none;
    border-radius:6px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#d97706;
}

.terminos{
    font-size:13px;
    color:#666;
    margin:15px 0;
    line-height:1.5;
}

.terminos input{
    width:auto;
    margin-right:5px;
}

.enlace{
    text-align:center;
    margin-top:20px;
    color:#666;
}

.enlace a{
    color:#d97706;
    font-weight:bold;
    text-decoration:none;
}

.enlace a:hover{
    text-decoration:underline;
}

.volver{
    text-align:center;
    margin-top:15px;
}

.volver a{
    color:#1f2937;
    text-decoration:none;
    font-weight:bold;
}

.volver a:hover{
    color:#f59e0b;
}
</style>

</head>

<body>

<div class="contenedor">

    <h1>Ferretería <span>BOB</span></h1>

    <p class="subtitulo">Crea tu cuenta</p>

    <form id="formRegistro">

        <div class="grupo">
            <label for="nombre">Nombre completo</label>
            <input type="text" id="nombre" placeholder="Ingresa tu nombre" required>
        </div>

        <div class="grupo">
            <label for="correo">Correo electrónico</label>
            <input type="email" id="correo" placeholder="ejemplo@gmail.com" required>
        </div>

        <div class="grupo">
            <label for="telefono">Teléfono</label>
            <input type="tel" id="telefono" placeholder="3001234567" required>
        </div>

        <div class="grupo">
            <label for="password">Contraseña</label>
            <input type="password" id="password" placeholder="Crea una contraseña" required>
        </div>

        <div class="grupo">
            <label for="confirmar">Confirmar contraseña</label>
            <input type="password" id="confirmar" placeholder="Repite tu contraseña" required>
        </div>

        <div class="terminos">

</div>

<button type="submit">Crear cuenta</button>

</form>

<div class="enlace">
    ¿Ya tienes una cuenta?
    <a href="LOGIN.html">Iniciar sesión</a>
</div>

<div class="volver">
    <a href="INICIO.html">← Volver al inicio</a>
</div>

</div>

<script>

document.getElementById("formRegistro").addEventListener("submit",async function(e){
e.preventDefault();

const nombre=document.getElementById("nombre").value.trim();
const correo=document.getElementById("correo").value.trim();
const telefono=document.getElementById("telefono").value.trim();
const password=document.getElementById("password").value;
const confirmar=document.getElementById("confirmar").value;

if(password!==confirmar){
alert("Las contraseñas no coinciden");
return;
}

try{
const respuesta = await fetch(
    "https://ferreteria-bob.onrender.com/api/usuarios/registro",
    {
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({
            nombre,
            correo,
            telefono,
            password
        })
    }
);

const datos = await respuesta.json();

console.log("Estado:",respuesta.status);
console.log("Respuesta:",datos);

if(respuesta.ok){
alert(datos.mensaje);
document.getElementById("formRegistro").reset();
}else{
alert("Error: "+(datos.mensaje||"No se pudo registrar el usuario"));
}

}catch(error){
console.error("ERROR REAL:",error);
alert("No se pudo conectar con el servidor. Revisa la terminal de Node.js.");
}
});

</script>

</body>
</html>
