<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Administrador | Ferretería BOB</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}
body{
    background:#f4f6f9;
}
.header{
    width:100%;
    height:70px;
    background:#1f2937;
    color:white;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 30px;
}
.logo{
    font-size:24px;
    font-weight:bold;
}
.logo span{
    color:#f59e0b;
}
.usuario{
    font-size:16px;
}
.container{
    display:flex;
    min-height:calc(100vh - 70px);
}
.sidebar{
    width:250px;
    background:#111827;
    padding-top:20px;
}
.sidebar a{
    display:block;
    color:white;
    text-decoration:none;
    padding:15px 20px;
    transition:.3s;
}
.sidebar a:hover{
    background:#f59e0b;
}
.main{
    flex:1;
    padding:30px;
}
.titulo{
    color:#1f2937;
    margin-bottom:25px;
}
.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
}
.card{
    background:rgb(253, 252, 252);
    padding:25px;
    border-radius:12px;
    box-shadow:0 4px 10px rgba(0,0,0,.1);
    text-align:center;
}
.card h3{
    color:#1f2937;
    margin-bottom:10px;
}
.card p{
    font-size:28px;
    color:#f59e0b;
    font-weight:bold;
}
.seccion{
    margin-top:35px;
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 4px 10px rgba(0,0,0,.1);
}
.seccion h2{
    color:#1f2937;
    margin-bottom:20px;
}
.botones{
    display:flex;
    flex-wrap:wrap;
    gap:15px;
}
.btn{
    background:#f59e0b;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
    transition:.3s;
}
.btn:hover{
    background:#d97706;
    transform:translateY(-3px);
}
@media(max-width:768px){
    .container{
        flex-direction:column;
    }
    .sidebar{
        width:100%;
    }
}
</style>
</head>
<body>
<header class="header">
    <div class="logo">Ferretería <span>BOB</span></div>
    <div class="usuario">Administrador</div>
</header>
<div class="container">
    <nav class="sidebar">
        🏠 Inicio</a>
        📦 Productos</a>
        📋 Inventario</a>
        🛒 Pedidos</a>
        👥 Usuarios</a>
        📊 Reportes</a>
        <a href="LOGIN.html"> Cerrar sesión</a>
    </nav>
    <main class="main">
        <h1 class="titulo">Panel de Administración</h1>
        <div class="cards">
            <div class="card">
                <h3>Productos</h3>
                <p>120</p>
            </div>
            <div class="card">
                <h3>Pedidos</h3>
                <p>0</p>
            </div>
            <div class="card">
                <h3>Clientes</h3>
                <p>0</p>
            </div>
            <div class="card">
                <h3>Ventas</h3>
                <p>$0</p>
            </div>
        </div>
        <div class="seccion">
            <h2>Acciones rápidas</h2>
            <div class="botones">
                <button class="btn">Agregar Producto</button>
                <button class="btn">Actualizar Inventario</button>
                <button class="btn">Gestionar Usuarios</button>
                <button class="btn">Ver Pedidos</button>
                <button class="btn">Generar Reporte</button>
            </div>
        </div>
    </main>
</div>
</body>
</html>
